[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ode-wp1-methods"
version = "1.0.0"
description = "ODE-RESEARCH-012 WP1 method pack"
requires-python = ">=3.11"
dependencies = [
  "ode-wp2-runtime @ git+https://github.com/molihh/ODE-RESEARCH-012-WP2@7d2fec7652ccab77df4c216e6f3c76c191973688",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
